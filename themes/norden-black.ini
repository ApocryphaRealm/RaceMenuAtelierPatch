; RaceMenu Atelier theme - Norden Black.
; Installed as Data\SKSE\Plugins\RaceMenuAtelier\theme.ini by the "RaceMenu Atelier - Norden Black" patch; the
; patched Atelier reads it at start-up. Delete the file to get Atelier's own colours back.
;
; The palette of Norden UI - Black (Norden UI by Nithog, its #333333 panels taken to black, darker greys halved toward
; black: v' = max(0, round((v - 51) * 0.5)), so #666666 -> #1A1A1A) and of Apocrypha Menu Framework's "Norden - Black"
; theme: lines and highlights are Norden's silver #BBBDBF, borders #8E9396, text #E5E5E5 and #999999. No Norden art.
;
; Every colour is #RRGGBB or #RRGGBBAA (AA = opacity, FF solid). fRounding scales every corner: 1 = Atelier's rounded
; corners, 0 = square, as Norden's panels are.

sName = Norden Black
fRounding = 0

; surfaces
Window = #000000F2
Panel = #0D0D0DEB
PanelHover = #1A1A1AF5
PopupBg = #050505FA
Row = #080808F0
RowAlt = #0F0F0FF0
RowHover = #1F1F1FFA
RowBorder = #8E939670
Frame = #141414
FrameHover = #222222
FrameActive = #2E2E2E
Track = #000000EB
Border = #8E9396AA
BorderStrong = #BBBDBFE6
ModalDim = #000000A0

; text
Text = #E5E5E5
TextDim = #999999
TextFaint = #6B6B6B
Value = #D9DADB
TileText = #D0D0D0
OnAccent = #000000

; the accent: Atelier's gold becomes Norden's silver
Accent = #BBBDBF
AccentBright = #FFFFFF
AccentDim = #6E7073
AccentWash = #BBBDBF28
AccentWashStrong = #BBBDBF54
HeaderHover = #BBBDBF3C
TextSelected = #BBBDBF5A
ScrollGrab = #8E939696
ScrollGrabHover = #BBBDBFC8
KnobHover = #FFFFFF

; group hues, muted toward grey so the panel stays near-monochrome like Norden (Atelier's ten hues, half saturation)
Hue0 = #8FA3B5
Hue1 = #B59A80
Hue2 = #8FB0A6
Hue3 = #A99DBF
Hue4 = #A3B391
Hue5 = #B8959D
Hue6 = #B5AD8A
Hue7 = #8DB0B8
Hue8 = #B394B0
Hue9 = #A6ABB5
